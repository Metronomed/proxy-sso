name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Commit the release and tag the build
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun scripts/release.js "$BUMP"
          echo "TAG=v$(jq -r .version package.json)" >> "$GITHUB_ENV"
      - name: Install the tag like an app would
        run: |
          app="$(mktemp -d)"
          cd "$app"
          echo '{ "name": "smoke", "private": true, "type": "module" }' > package.json
          bun add "git+file://$GITHUB_WORKSPACE#$TAG"
          test "$(LC_ALL=C ls node_modules/@metronomed/proxy-sso | tr '\n' ' ')" = "LICENSE README.md dist package.json "
          node -e 'import("@metronomed/proxy-sso/server").then((m) => { if (!m.verifyProxyIdentity) process.exit(1); })'
          node -e 'import("@metronomed/proxy-sso/web").then((m) => { if (!m.isProxyRedirect) process.exit(1); })'
      - name: Push the release commit and tag
        run: git push --atomic origin main "refs/tags/$TAG"
      - name: Create the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v h="## [${TAG#v}]" 'index($0, h) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
